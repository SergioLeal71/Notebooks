<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Préstamo de netbooks</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  
  <header>
    <h2>Instituto Técnico Renault</h2>
  </header>

  <main>
    <h1>Préstamo de netbooks</h1>

    <div class="columnas">

  
      <section class="caja">
        <h3>Datos del préstamo</h3>

        <label for="alumno">Nombre del alumno</label>
        <input type="text" id="alumno" placeholder="Ej: Lucía Gómez">

        <label for="curso">Curso</label>
        <input type="text" id="curso" placeholder="Ej: 5° 2°">

        <label for="serie">N° de serie del equipo</label>
        <input type="text" id="serie" placeholder="Ej: NB-0142">

        <button id="btnPrestar" class="amarillo">Registrar préstamo</button>
        <button id="btnDevolver">Devolver equipo</button>
        <button id="btnHistorial">Ver historial</button>

        <p id="mensaje"></p>
      </section>

  
      <section class="caja">
        <h3>Equipos prestados ahora</h3>
        <div id="listaActivos"></div>
      </section>

    </div>

  
    <section class="caja" id="historial" style="display: none;">
      <h3>Historial</h3>
      <div id="listaHistorial"></div>
      <button id="btnBorrar">Borrar historial</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
